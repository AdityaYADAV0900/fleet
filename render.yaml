databases:
  - name: aeropulse-db
    databaseName: fleetmaint
    user: fleetmaint
    plan: free

services:
  - type: web
    name: aeropulse-backend
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python scripts/start_cloud.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: aeropulse-db
          property: connectionString

  - type: web
    name: aeropulse-frontend
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
      - type: rewrite
        source: "/api/*"
        destination: "https://aeropulse-backend.onrender.com/api/*"
    envVars:
      - key: VITE_API_BASE_URL
        value: "/api/v1"
