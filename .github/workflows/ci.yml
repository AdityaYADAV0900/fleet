name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Native Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start Native PostgreSQL Service (No Containers)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE fleet WITH LOGIN PASSWORD 'fleet_dev_pw' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE fleetmaint OWNER fleet;"
          sudo -u postgres psql -c "CREATE DATABASE fleetmaint_test OWNER fleet;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE fleetmaint TO fleet;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE fleetmaint_test TO fleet;"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Code Quality Linters
        run: |
          python scripts/tasks.py lint

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint
          TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint_test
        run: |
          python scripts/tasks.py migrate

      - name: Seed Synthetic Fleet Data
        env:
          DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint
          TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint_test
        run: |
          python scripts/tasks.py seed --seed 42

      - name: Train ML Models & Generate Artifacts
        env:
          DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint
          TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint_test
        run: |
          python scripts/tasks.py train --all

      - name: Build Frontend Production Bundle
        run: |
          python scripts/tasks.py build

      - name: Run Backend & Frontend Test Suites
        env:
          DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint
          TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet_dev_pw@localhost:5432/fleetmaint_test
        run: |
          python scripts/tasks.py test

